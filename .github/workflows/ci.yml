name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Python 3.9 has no build for the newest runner image.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy quotapilot
      - name: Tests
        run: python -m pytest -q

  wheel-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install it in a fresh virtual environment
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/python -m pip install dist/*.whl
      - name: Run the examples
        working-directory: /tmp
        run: |
          for example in "$GITHUB_WORKSPACE"/examples/*.py; do
            echo "== $example"
            /tmp/fresh/bin/python "$example"
          done

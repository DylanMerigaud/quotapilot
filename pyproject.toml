[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "quotapilot"
dynamic = ["version"]
description = "Project what expires unused across several accounts with weekly quota windows, and say which account to drain first. No dependencies, no network."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dylan Merigaud" }]
keywords = ["quota", "rate-limit", "usage", "claude", "claude-swap", "accounts", "scheduling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/DylanMerigaud/quotapilot"
Source = "https://github.com/DylanMerigaud/quotapilot"
Issues = "https://github.com/DylanMerigaud/quotapilot/issues"
Changelog = "https://github.com/DylanMerigaud/quotapilot/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff", "mypy", "build"]

[tool.hatch.version]
path = "quotapilot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["quotapilot"]

[tool.hatch.build.targets.sdist]
include = ["/quotapilot", "/tests", "/examples", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CONTRIBUTING.md", "/ruff.toml"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
